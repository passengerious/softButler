<svg width="200" height="60" viewBox="0 0 200 60" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bug-body { fill: #22C55E; }
      .bug-detail { fill: #06B6D4; }
      .wordmark { fill: #111827; }
    </style>
  </defs>
  
  <!-- Icon Group -->
  <g id="icon">
    <!-- Beetle body (main shape) -->
    <path class="bug-body" d="M25 20 C25 15, 30 10, 35 10 L45 10 C50 10, 55 15, 55 20 L55 30 C55 35, 50 40, 45 40 L35 40 C30 40, 25 35, 25 30 Z"/>
    
    <!-- Target/magnifying glass detail -->
