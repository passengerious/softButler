<svg width="60" height="60" viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bug-body { fill: #22C55E; }
      .bug-detail { fill: #06B6D4; }
    </style>
  </defs>
  
  <!-- Icon Group -->
  <g id="icon">
    <!-- Beetle body (main shape) -->
    <path class="bug-body" d="M15 30 C15 25, 20 20, 25 20 L35 20 C40 20, 45 25, 45 30 L45 40 C45 45, 40 50, 35 50 L25 50 C20 50, 15 45, 15 40 Z"/>
    
    <!-- Target/magnifying glass detail -->
    <circle class="bug-detail" cx="30" cy="35" r="8"/>
    <circle class="bug-detail" cx="30" cy="35" r="4" fill="white"/>
    <circle class="bug-detail" cx="30" cy="35" r="2" fill="#06B6D4"/>
    
    <!-- Antennae -->
    <path class="bug-body" d="M20 25 L18 18 M40 25 L42 18" stroke="#22C55E" stroke-width="2" fill="none"/>
    <circle class="bug-body" cx="18" cy="18" r="1.5"/>
    <circle class="bug-body" cx="42" cy="18" r="1.5"/>
  </g>
</svg>
